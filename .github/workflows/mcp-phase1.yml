name: mcp-ci

on:
  push:
    branches:
      - main
      - feat/phase-01-core-search
      - feat/phase-03-verification-submission
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-phase1.yml"
  pull_request:
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-phase1.yml"

defaults:
  run:
    working-directory: mcp

jobs:
  fast-checks:
    name: typecheck, unit tests, sandbox tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Keep pinned to the toolchain this project develops against.
          node-version: "26.4.0"
          cache: "npm"
          cache-dependency-path: mcp/package-lock.json

      - name: Pin npm to the project's toolchain version
        run: npm install -g npm@12.0.1

      # `npm ci` cannot be used here: the repo root became an npm workspaces
      # monorepo (root package.json declares "workspaces": ["mcp", "web"]),
      # so npm resolves the lockfile at the workspace root, not mcp/package-lock.json
      # — and the root lockfile is intentionally gitignored/absent so NitroCloud's
      # build can do a dynamic install. `npm install` works the same way NitroCloud's
      # own build does.
      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # GitHub-hosted ubuntu-latest runners ship a real Docker daemon, so this
      # actually exercises SandboxClient (Checkpoint 5) end-to-end: PASS/FAIL,
      # timeout+cleanup, output limits, network denial, and host isolation.
      # The Elasticsearch integration suite self-skips (no ELASTICSEARCH_URL here).
      - name: Integration tests (sandbox + credential-gated suites)
        run: npm run test:integration

      - name: Production build
        run: npm run build
